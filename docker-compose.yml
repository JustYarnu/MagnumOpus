version: '3.8'

services:
  commit-bot:
    build: .
    container_name: MagnumOpus
    volumes:
      - ./:/app
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no