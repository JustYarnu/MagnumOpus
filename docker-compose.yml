services:
  commit-bot:
    build: .
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no
      - SSH_AUTH_SOCK=/ssh-agent
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - ~/.ssh:/root/.ssh:ro
      - /run/host-services/ssh-auth.sock:/ssh-agent