services:
  commit-bot:
    build: .
    environment:
      - GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      # We have lost the fucking plot
      - ~/.ssh:/tmp/.ssh:ro
    command: >
      sh -c "mkdir -p /root/.ssh && 
      cp /tmp/.ssh/id_rsa /root/.ssh/id_rsa && 
      chmod 600 /root/.ssh/id_rsa && 
      python app/main.py"